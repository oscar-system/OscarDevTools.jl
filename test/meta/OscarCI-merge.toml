title = "metadata for oscar CI run"

# keep it small to prevent job-explosion
[env]
os = [ "ubuntu-latest" ]
julia-version = [ "~1.10.0-0" ]

# for OscarDevTools we mostly use release versions
[pkgs]
  [pkgs.Oscar]
  branches = [ "master" ]
  test = false
  testoptions = []

  [pkgs.Polymake]
  branches = [ "oscarci/testbranch/dontdelete" ]
  test = true
  testoptions = []
